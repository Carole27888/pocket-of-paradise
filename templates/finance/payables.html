{% extends "components/table_page.html" %}
{% block above %}
<div class="grid grid-main-side mb-4">
  <div class="card"><div class="card-head"><h2>Payables aging</h2><span class="sub">Days past due</span></div>
    <div class="strip">{% for label, v in aging.buckets.items %}<div class="cell"><b>{{ v|money_compact }}</b><span>{{ label }} days</span></div>{% endfor %}</div></div>
  <div class="card"><div class="card-head"><h2>Total owed</h2></div><div class="kpi-value">{{ aging.total|money_compact }}</div><p class="text-sm text-muted">Group by trip in <a href="{% url 'suppliers:departures' %}">Departure Costs</a>.</p></div>
</div>
{% endblock %}
