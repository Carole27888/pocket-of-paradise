<div class="field{% if f.errors %} invalid{% endif %}{% if full %} full{% endif %}">
  <label for="{{ f.id_for_label }}">{{ f.label }}{% if f.field.required %} <span class="req">*</span>{% endif %}</label>
  {{ f }}
  {% if f.help_text %}<span class="help">{{ f.help_text }}</span>{% endif %}
  {% for e in f.errors %}<span class="error">{{ e }}</span>{% endfor %}
</div>
