{% load static %}
<div id="ai-assistant" data-url="{% url 'ict:assistant' %}">
  <button type="button" class="ai-fab" data-ai-open aria-expanded="false" aria-label="Ask the assistant">{% include "components/icon.html" with name="help-circle" size="22" %}</button>
  <section class="ai-panel" hidden aria-label="Assistant">
    <header><b>Ask the assistant</b><span>Search clients, enquiries, follow-ups and packages</span></header>
    <div class="ai-log" aria-live="polite"><div class="ai-msg ai-bot">Hi {{ request.user.full_name|default:"there"|truncatechars:18 }}! Ask me things like “find Wanjiru's enquiry” or “what are my follow-ups?”.</div></div>
    <form><input type="text" placeholder="Type a question" maxlength="400" aria-label="Question" autocomplete="off"><button type="submit" class="btn btn-primary btn-sm">Ask</button></form>
  </section>
</div>
<style>
#ai-assistant{position:fixed;right:16px;bottom:84px;z-index:60}@media(min-width:900px){#ai-assistant{bottom:20px}}
.ai-fab{width:48px;height:48px;border-radius:50%;border:0;background:var(--primary);color:#fff;box-shadow:var(--shadow-lg);cursor:pointer;display:grid;place-items:center}
.ai-panel{position:absolute;right:0;bottom:58px;width:min(340px,calc(100vw - 32px));background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden}
.ai-panel[hidden]{display:none}.ai-panel header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;font-size:.95rem}.ai-panel header span{font-size:.75rem;color:var(--text-muted)}
.ai-log{max-height:300px;min-height:120px;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}.ai-msg{padding:8px 10px;border-radius:10px;font-size:.88rem;max-width:92%;white-space:pre-wrap}
.ai-bot{background:var(--primary-soft);color:var(--text)}.ai-me{background:var(--primary);color:#fff;align-self:flex-end}
.ai-panel form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border)}.ai-panel input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;font:inherit;background:var(--card);color:var(--text)}
</style>
<script src="{% static 'js/assistant.js' %}" defer></script>
